plugins {
    id "com.android.application"
}

android {
    namespace "com.abosultan.darbaksystem.bridge"
    compileSdk 34

    defaultConfig {
        applicationId "com.abosultan.darbaksystem.bridge"
        minSdk 21
        targetSdk 25
        versionCode 2
        versionName "0.1.1"
    }

    buildTypes {
        debug {
            minifyEnabled false
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}
