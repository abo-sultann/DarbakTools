name: Build DarbakTools + Darbak Core

on:
  push:
    branches: [ main, darbak-platform-v1 ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Lint Darbak Core
        run: gradle --no-daemon --stacktrace :darbak-core:lintDebug

      - name: Build release for external signing
        run: gradle --no-daemon --stacktrace :app:assembleRelease :app:lintRelease

      - name: Prepare APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release-unsigned.apk dist/DarbakTools-release-unsigned.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DarbakTools-release-unsigned
          path: dist/DarbakTools-release-unsigned.apk
          if-no-files-found: error
          retention-days: 1
