name: Build Darbak System Bridge

on:
  push:
    branches:
      - darbak-system-bootstrap
    paths:
      - "DarbakSystemBridge/**"
      - ".github/workflows/build-darbak-system-bridge.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build debug APK
        run: gradle -p DarbakSystemBridge :app:assembleDebug --stacktrace

      - name: Prepare artifact
        run: |
          mkdir -p dist
          cp DarbakSystemBridge/app/build/outputs/apk/debug/app-debug.apk dist/Darbak-System-Bridge-v0.1.4.apk
          sha256sum dist/Darbak-System-Bridge-v0.1.4.apk | tee dist/Darbak-System-Bridge-v0.1.4.apk.sha256

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Darbak-System-Bridge-v0.1.4
          path: dist/*
          if-no-files-found: error
          retention-days: 1
